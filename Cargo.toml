[package]
name = "prog-rs"
version = "0.1.0"
edition = "2024"
description = "A minimal GPUI app showing an animated gradient in a 100x100 px box"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
gpui = { git = "ssh://git@github.com/zed-industries/zed" }
gpui_platform = { git = "ssh://git@github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
] }
